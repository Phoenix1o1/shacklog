# docker compose -f deploy/docker-compose.yml up -d --build   (run from the project root)
services:
  shacklog:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: shacklog
    restart: unless-stopped
    ports:
      - "8573:8573"
    volumes:
      - ./shacklog-data:/data          # database, library files, backups — back this up
    environment:
      # Optional: set the web password on first start instead of using the setup code.
      # Remove it again afterwards.
      # SHACKLOG_PASSWORD: "change-me-please"
      TZ: Europe/Rome
