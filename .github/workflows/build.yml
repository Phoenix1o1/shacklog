# Tests on every push; executables for Windows, Linux and macOS on every push to main
# (downloadable from the run's "Artifacts") and attached to a GitHub Release when a tag
# like v1.0.0 is pushed.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach binaries to releases

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Debian 12 / Proxmox host, 3.13 = Debian 13 container, 3.14 = Andrea's PC
        os: [ubuntu-latest]
        python: ["3.11", "3.13", "3.14"]
        include:
          # The PC updater runs these tests on Windows before rebuilding: a test that
          # only fails there would block every update, so catch it here first.
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          shellcheck -S warning -x deploy/install.sh deploy/uninstall.sh deploy/shacklog-ctl \
            deploy/proxmox/shacklog-lxc.sh deploy/proxmox/validate.sh deploy/docker/entrypoint.sh \
            packaging/build_unix.sh packaging/update_unix.sh

  docker:
    # The Docker variant of the hub: the image builds, starts, creates its database in
    # the volume and answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the image
        run: |
          # No data folder yet, as on a first install: Docker creates it (owned by root).
          docker compose -f deploy/docker/docker-compose.yml up -d --build
      - name: Wait for it to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8573/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8573/healthz | grep -q '"app": *"ShackLog"'
          test -f deploy/shacklog-data/shacklog.sqlite3
          # created by the program itself, running as the unprivileged user
          docker compose -f deploy/docker/docker-compose.yml exec -T shacklog stat -c %U /data/shacklog.sqlite3 | grep -qx shacklog
          docker compose -f deploy/docker/docker-compose.yml exec -T shacklog sh -c 'grep ^Uid: /proc/1/status' | grep -q '1000'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8573/login
      - name: Logs
        if: always()
        run: docker compose -f deploy/docker/docker-compose.yml logs --tail 80

  executable:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: dist/ShackLog.exe
            asset: ShackLog-windows.exe
          - os: ubuntu-22.04  # older glibc = runs on more Linux systems
            binary: dist/ShackLog
            asset: ShackLog-linux
          - os: macos-latest
            binary: dist/ShackLog
            asset: ShackLog-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pyinstaller packaging/shacklog.spec --noconfirm
      - name: Smoke test and rename per platform
        shell: bash
        run: |
          ${{ matrix.binary }} --version
          mkdir -p release
          cp "${{ matrix.binary }}" "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.asset }}
          name: ShackLog ${{ github.ref_name }}
          fail_on_unmatched_files: false
