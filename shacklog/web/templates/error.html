{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<div class="empty">
  <h1>{{ {404: 'Not found', 400: 'Request not accepted', 500: 'Server error'}.get(code, 'Error') }}</h1>
  <p>{{ message }}</p>
  <a class="btn" href="{{ url_for('main.dashboard') }}">Go to the dashboard</a>
</div>
{% endblock %}
